<!doctype html>
<html lang="sv">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link href="styles/style.css" rel="stylesheet" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Petit+Formal+Script&display=swap"
			rel="stylesheet"
		/>
		<title>Dela ditt recept</title>
	</head>
	<body>
		<a href="#main-content" class="skip-link">Hoppa till huvudinnehåll</a>

		<header class="main-header">
			<a href="index.html" class="logo">LOGO</a>
			<nav aria-label="Main Navigation">
				<ul role="list">
					<li><a href="recipe.html">Recept</a></li>
					<li><a href="#">Om Sajten</a></li>
					<li>
						<a href="share-recipe.html" aria-current="page">Dela Recept</a>
					</li>
				</ul>
			</nav>
		</header>

		<main class="share-recipe" id="main-content">
			<h1>Dela ditt recept!</h1>

			<form>
				<fieldset>
					<legend>Om receptet</legend>

					<!-- Recepie Name -->
					<div class="form-group">
						<label for="name">Receptets namn *</label>
						<input
							type="text"
							id="name"
							name="name"
							placeholder="Mammas lasagne"
							required
						/>
					</div>

					<!-- Category -->
					<div class="form-group">
						<label for="category">Kategori</label>
						<select id="category" name="category">
							<option value="">-- Välj kategori --</option>
							<option value="breakfast">Frukost</option>
							<option value="dinner">Middag</option>
							<option value="dessert">Efterrätt</option>
							<option value="fika">Fika</option>
						</select>
					</div>

					<!-- Time and Portions -->
					<div class="time-portions">
						<div class="form-group">
							<label for="time">Tid i minuter</label>
							<input type="number" id="time" name="time" min="1" />
						</div>

						<div class="form-group">
							<label for="portions">Antal portioner</label>
							<input type="number" id="portions" name="portions" min="1" />
						</div>
					</div>
				</fieldset>

				<!-- Level -->
				<fieldset class="level">
					<legend>Svårighetsgrad</legend>

					<label for="easy"
						><input
							type="radio"
							id="easy"
							name="level"
							value="easy"
						/>Lätt</label
					>

					<label for="intermediate"
						><input
							type="radio"
							id="intermediate"
							name="level"
							value="intermediate"
						/>Medel</label
					>

					<label for="hard"
						><input
							type="radio"
							id="hard"
							name="level"
							value="hard"
						/>Svår</label
					>
				</fieldset>

				<!-- Ingredients and Instructions -->
				<fieldset>
					<legend>Receptet</legend>

					<fieldset class="ingredients-container">
						<legend>
							Ingredienser
							<span class="block">* minst 3 ingredienser</span>
						</legend>
						<div class="ingredients-header" aria-hidden="true">
							<span>Mängd</span>
							<span>Enhet</span>
							<span>Ingredienser</span>
						</div>

												<div class="ingredient-row">
							<label>
								<span class="visually-hidden">Mängd, ingrediens 1</span>
								<input
									type="number"
									step="any"
									min="0"
									name="amount[]"
									placeholder="2"
									aria-label="Mängd"
									required
								/>
							</label>
							<label>
								<span class="visually-hidden">Enhet, ingrediens 1</span>
							<input
								type="text"
								name="unit[]"
								list="units"
								placeholder="dl"
								aria-label="Enhet"
								required
							/>
							</label>
							<label>
								<span class="visually-hidden">Ingrediens 1</span>
							<input
								type="text"
								name="ingredients[]"
								placeholder="Vetemjöl"
								aria-label="Ingredienser"
								required
							/>
						</div>
						<div class="ingredient-row">
							<label>
								<span class="visually-hidden">Mängd, ingrediens 2</span>
								<input
									type="number"
									step="any"
									min="0"
									name="amount[]"
									placeholder="2"
									aria-label="Mängd"
									required
								/>
							</label>
							<label>
								<span class="visually-hidden">Enhet, ingrediens 2</span>
							<input
								type="text"
								name="unit[]"
								list="units"
								placeholder="dl"
								aria-label="Enhet"
								required
							/>
							</label>
							<label>
								<span class="visually-hidden">Ingrediens 2</span>
							<input
								type="text"
								name="ingredients[]"
								placeholder="Vetemjöl"
								aria-label="Ingredienser"
								required
							/>
						</div>
						<div class="ingredient-row">
							<label>
								<span class="visually-hidden">Mängd, ingrediens 3</span>
								<input
									type="number"
									step="any"
									min="0"
									name="amount[]"
									placeholder="2"
									aria-label="Mängd"
									required
								/>
							</label>
							<label>
								<span class="visually-hidden">Enhet, ingrediens 3</span>
							<input
								type="text"
								name="unit[]"
								list="units"
								placeholder="dl"
								aria-label="Enhet"
								required
							/>
							</label>
							<label>
								<span class="visually-hidden">Ingrediens 3</span>
							<input
								type="text"
								name="ingredients[]"
								placeholder="Vetemjöl"
								aria-label="Ingredienser"
								required
							/>
						</div>
						<div class="ingredient-row">
							<label>
								<span class="visually-hidden">Mängd, ingrediens 4</span>
								<input
									type="number"
									step="any"
									min="0"
									name="amount[]"
									placeholder="2"
									aria-label="Mängd"
									required
								/>
							</label>
							<label>
								<span class="visually-hidden">Enhet, ingrediens 4</span>
							<input
								type="text"
								name="unit[]"
								list="units"
								placeholder="dl"
								aria-label="Enhet"
								required
							/>
							</label>
							<label>
								<span class="visually-hidden">Ingrediens 4</span>
							<input
								type="text"
								name="ingredients[]"
								placeholder="Vetemjöl"
								aria-label="Ingredienser"
								required
							/>
						</div>
						<div class="ingredient-row">
							<label>
								<span class="visually-hidden">Mängd, ingrediens 5</span>
								<input
									type="number"
									step="any"
									min="0"
									name="amount[]"
									placeholder="2"
									aria-label="Mängd"
									required
								/>
							</label>
							<label>
								<span class="visually-hidden">Enhet, ingrediens 5</span>
							<input
								type="text"
								name="unit[]"
								list="units"
								placeholder="dl"
								aria-label="Enhet"
								required
							/>
							</label>
							<label>
								<span class="visually-hidden">Ingrediens 5</span>
							<input
								type="text"
								name="ingredients[]"
								placeholder="Vetemjöl"
								aria-label="Ingredienser"
								required
							/>
						</div>
						<div class="ingredient-row">
							<label>
								<span class="visually-hidden">Mängd, ingrediens 6</span>
								<input
									type="number"
									step="any"
									min="0"
									name="amount[]"
									placeholder="2"
									aria-label="Mängd"
	
								/>	
							</label>
							<label>
								<span class="visually-hidden">Enhet, ingrediens 6</span>
							<input
								type="text"
								name="unit[]"
								list="units"
								placeholder="dl"
								aria-label="Enhet"
		
							/>
							</label>
							<label>
								<span class="visually-hidden">Ingrediens 6</span>
							<input
								type="text"
								name="ingredients[]"
								placeholder="Vetemjöl"
								aria-label="Ingredienser"

							/>
						</div>

					</label>
					</fieldset>

					<div class="form-group">
						<label for="instructions">Gör så här *</label>
						<textarea
							id="instructions"
							name="instructions"
							rows="5"
							required
						></textarea>
					</div>
				</fieldset>

				<datalist id="units">
					<option value="krm"></option>
					<option value="tsk"></option>
					<option value="msk"></option>
					<option value="dl"></option>
					<option value="ml"></option>
					<option value="l"></option>
					<option value="g"></option>
					<option value="hg"></option>
					<option value="kg"></option>
					<option value="st"></option>
				</datalist>

				<!-- User Info -->
				<fieldset>
					<legend>Om dig</legend>

					<div class="form-group">
						<label for="user-name">Ditt namn</label>
						<input type="text" id="user-name" name="user-name" />
					</div>

					<div class="form-group">
						<label for="email">E-post *</label>
						<input
							type="email"
							id="email"
							name="email"
							placeholder="namn@email.com"
							required
						/>
					</div>
				</fieldset>

				<button type="submit">Skicka recept</button>
			</form>
		</main>
		<footer>
			<p class="m-bottom m-top m-left">&copy; 2026 Lisa Lillhannus</p>
			<p class="m-right m-top"><a href="index.html">LOGO</a></p>
		</footer>
	</body>
</html>
